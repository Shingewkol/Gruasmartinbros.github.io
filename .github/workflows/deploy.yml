name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      maintenance:
        description: Mostrar la página de mantenimiento en la portada
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build site
        run: npm run build
        env:
          VITE_MAINTENANCE: ${{ inputs.maintenance || 'false' }}
      - name: Prepare Pages files
        run: |
          cp -R imagenes dist/imagenes
          if [ "$VITE_MAINTENANCE" = "true" ]; then
            cp dist/mantenimiento.html dist/index.html
          fi
        env:
          VITE_MAINTENANCE: ${{ inputs.maintenance || 'false' }}
      - name: Add custom domain
        run: cp CNAME dist/CNAME
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4