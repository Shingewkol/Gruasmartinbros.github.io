name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      maintenance:
        description: Mostrar la página de mantenimiento en la portada
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Build site
        run: npm run build
        env:
          VITE_MAINTENANCE: ${{ inputs.maintenance || 'false' }}
      - name: Prepare Pages files
        run: |
          cp -R imagenes dist/imagenes
          if [ "$VITE_MAINTENANCE" = "true" ]; then
            cp dist/mantenimiento.html dist/index.html
            cp dist/mantenimiento.html dist/fotografia.html
          fi
        env:
          VITE_MAINTENANCE: ${{ inputs.maintenance || 'false' }}
      - name: Add custom domain
        run: cp CNAME dist/CNAME
      - name: Publish security policy
        run: |
          cp SECURITY.md dist/SECURITY.md
          mkdir -p dist/.well-known
          cp .well-known/security.txt dist/.well-known/security.txt
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4