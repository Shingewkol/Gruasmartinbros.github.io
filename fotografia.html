<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fotografia | Grúa Martín Bros</title>
    <link rel="icon" type="image/jpeg" href="imagenes/logo_icon.jpg" />
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --card: #1f2937;
        --primary: #69f50b;
        --primary-dark: #69f50b;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --surface: #f8fafc;
        --dark: #020817;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        position: relative;
        isolation: isolate;
        overflow-x: hidden;
        background: linear-gradient(180deg, #0b1120 0%, #111827 100%);
        color: var(--text);
        line-height: 1.6;
      }

      body::before,
      body::after {
        content: "";
        position: fixed;
        width: 32rem;
        height: 32rem;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.35;
        pointer-events: none;
        z-index: -1;
        animation: glowShift 14s ease-in-out infinite alternate;
      }

      body::before {
        top: -8rem;
        left: -6rem;
        background: rgba(105, 245, 11, 0.26);
      }

      body::after {
        right: -7rem;
        bottom: -9rem;
        background: rgba(59, 130, 246, 0.22);
        animation-delay: 2s;
      }

      @keyframes glowShift {
        0% {
          transform: translate3d(0, 0, 0) scale(1);
        }
        50% {
          transform: translate3d(30px, 20px, 0) scale(1.1);
        }
        100% {
          transform: translate3d(-18px, 26px, 0) scale(1.2);
        }
      }

      .page,
      footer {
        position: relative;
        z-index: 1;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      img {
        max-width: 100%;
        display: block;
      }

      .container {
        width: min(1100px, calc(100% - 2rem));
        margin: 0 auto;
      }

      header {
        background: rgba(15, 23, 42, 0.9);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        position: sticky;
        top: 0;
        z-index: 10;
      }

      .nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 72px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 700;
      }

      .brand img {
        width: 42px;
        height: 42px;
        object-fit: cover;
        border-radius: 12px;
        border: 1px solid rgba(255,255,255,0.12);
      }

      .nav-links {
        display: flex;
        gap: 1.5rem;
        color: var(--muted);
      }

      .nav-links a:hover {
        color: var(--text);
      }

      .btn {
        display: inline-block;
        padding: 0.9rem 1.4rem;
        border-radius: 999px;
        font-weight: 700;
      }

      .btn-primary {
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: #111827;
      }

      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .page {
        padding: 4rem 0;
        flex: 1;
      }

      .hero {
        text-align: center;
        margin-bottom: 2rem;
      }

      .hero h1 {
        font-size: clamp(2rem, 4vw, 3rem);
        margin: 0 0 1rem;
      }

      .hero p {
        color: var(--muted);
        max-width: 700px;
        margin: 0 auto;
      }

      .gallery {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 1.5rem;
      }

      .gallery[hidden] {
        display: none;
      }

      .gallery-item {
        background: rgba(17, 24, 39, 0.8);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 18px;
        overflow: hidden;
      }

      .gallery-item img {
        width: 100%;
        height: 260px;
        object-fit: cover;
      }

      .back-link {
        display: inline-block;
        margin-top: 2rem;
        margin-left: auto;
      }

      .page-actions {
        display: flex;
        justify-content: flex-end;
        margin-top: 2rem;
      }

      .pagination {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        margin-top: 2rem;
      }

      .pagination button {
        border: 0;
        cursor: pointer;
        font: inherit;
      }

      .pagination button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }

      footer {
        padding: 1.25rem 0 2rem;
        text-align: center;
        color: var(--muted);
      }

      @media (max-width: 820px) {
        .gallery {
          grid-template-columns: 1fr;
        }

        .nav {
          flex-wrap: wrap;
          justify-content: center;
          padding: 0.8rem 0;
        }

        .nav-links {
          width: 100%;
          justify-content: center;
          flex-wrap: wrap;
          padding-bottom: 0.4rem;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="container nav">
        <a href="index.html" class="brand" aria-label="Gruas Martinbros inicio">
          <img src="imagenes/logo_icon.jpg" alt="Gruas Martinbros" />
          <span>Grúas Martín Bros</span>
        </a>
        <nav class="nav-links" aria-label="Menú principal">
          <a href="index.html#servicios">Servicios</a>
          <a href="index.html#ventajas">Ventajas</a>
          <a href="fotografia.html">Fotografia</a>
          <a href="index.html#contacto">Contacto</a>
        </nav>
        <a class="btn btn-primary" href="index.html#contacto">Solicitar servicio</a>
      </div>
    </header>

    <main class="page">
      <div class="container">
        <section class="gallery" id="gallery-page-1" aria-label="Fotos, página 1 de 2">
          <article class="gallery-item">
            <img src="imagenes/WhatsApp%20Image%202026-10-06%20at%2014.33.01.jpeg" alt="Grúa trasladando un automóvil en una calle residencial" />
          </article>

          <article class="gallery-item">
            <img src="imagenes/WhatsApp%20Image%202026-10-06%20at%2014.32.19.jpeg" alt="Camioneta de grúa transportando vehículos con carro de arrastre" />
          </article>

          <article class="gallery-item">
            <img src="imagenes/WhatsApp%20Image%202026-10-06%20at%2014.32.19%20(1).jpeg" alt="Grúa trasladando dos vehículos por carretera" />
          </article>

          <article class="gallery-item">
            <img src="imagenes/WhatsApp%20Image%202026-10-06%20at%2014.32.18.jpeg" alt="Camión grúa y carro de arrastre durante un servicio nocturno" />
          </article>

          <article class="gallery-item">
            <img src="imagenes/WhatsApp%20Image%202026-10-06%20at%2014.32.18%20(1).jpeg" alt="Dos vehículos asegurados sobre un carro de arrastre" />
          </article>

          <article class="gallery-item">
            <img src="imagenes/WhatsApp%20Image%202026-10-02%20at%2012.14.53.jpeg" alt="Automóvil blanco transportado en una grúa" />
          </article>
        </section>

        <section class="gallery" id="gallery-page-2" aria-label="Fotos, página 2 de 2" hidden>
          <article class="gallery-item">
            <img src="imagenes/WhatsApp%20Image%202026-10-06%20at%2023.56.55.jpeg" alt="Camioneta de grúa trasladando un automóvil durante la noche" />
          </article>

          <article class="gallery-item">
            <img src="imagenes/WhatsApp%20Image%202026-10-06%20at%2023.56.55%20(1).jpeg" alt="Grúa trasladando un automóvil blanco" />
          </article>

          <article class="gallery-item">
            <img src="imagenes/WhatsApp%20Image%202026-10-06%20at%2023.56.55%20(2).jpeg" alt="Camioneta transportada sobre una grúa" />
          </article>

          <article class="gallery-item">
            <img src="imagenes/WhatsApp%20Image%202026-10-06%20at%2023.56.55%20(3).jpeg" alt="Grúa trasladando un remolque de carga" />
          </article>

          <article class="gallery-item">
            <img src="imagenes/WhatsApp%20Image%202026-10-06%20at%2023.56.55%20(4).jpeg" alt="Automóvil rojo asegurado en una grúa" />
          </article>

          <article class="gallery-item">
            <img src="imagenes/WhatsApp%20Image%202026-10-06%20at%2023.56.56.jpeg" alt="Automóvil blanco trasladado en una grúa" />
          </article>
        </section>

        <nav class="pagination" aria-label="Páginas de fotografías">
          <button class="btn btn-primary" id="previous-page" type="button" aria-controls="gallery-page-1 gallery-page-2" disabled>Anterior</button>
          <span id="page-status" aria-live="polite">Página 1 de 2</span>
          <button class="btn btn-primary" id="next-page" type="button" aria-controls="gallery-page-1 gallery-page-2">Siguiente</button>
        </nav>

        <div class="page-actions">
          <a class="btn btn-primary back-link" href="index.html">Volver al inicio</a>
        </div>
      </div>
    </main>

    <footer>
      <div class="container">© 2026 Wkol Host. Todos los derechos reservados.</div>
    </footer>
    <script>
      const galleryPages = [...document.querySelectorAll(".gallery")];
      const previousPageButton = document.querySelector("#previous-page");
      const nextPageButton = document.querySelector("#next-page");
      const pageStatus = document.querySelector("#page-status");
      let currentPage = 0;

      function showGalleryPage(pageIndex) {
        currentPage = Math.max(0, Math.min(pageIndex, galleryPages.length - 1));

        galleryPages.forEach((page, index) => {
          page.hidden = index !== currentPage;
        });

        previousPageButton.disabled = currentPage === 0;
        nextPageButton.disabled = currentPage === galleryPages.length - 1;
        pageStatus.textContent = `Página ${currentPage + 1} de ${galleryPages.length}`;
      }

      previousPageButton.addEventListener("click", () => showGalleryPage(currentPage - 1));
      nextPageButton.addEventListener("click", () => showGalleryPage(currentPage + 1));
    </script>
  </body>
</html>
